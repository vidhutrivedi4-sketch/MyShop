<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<nav class="navbar navbar-dark bg-dark px-3">

    <!-- LOGO -->
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
        🛒 MyShop
    </a>

    <!-- SEARCH -->
    <form class="d-flex flex-grow-1 mx-3" action="{% url 'search' %}" method="GET">
        <input class="form-control me-2" type="search" name="q" placeholder="Search products...">
        <button class="btn btn-warning" type="submit">Search</button>
    </form>

    <!-- LINKS -->
    <div class="d-flex align-items-center gap-3">

        <a href="{% url 'home' %}" class="text-white text-decoration-none">
            Home
        </a>

        <a href="{% url 'cart' %}" class="btn btn-outline-light btn-sm">
            🛒 Cart
        </a>

          <a href="{% url 'my_orders' %}" class="btn btn-outline-info btn-sm">
        📦 My Orders
    </a>

        {% if user.is_authenticated %}
            <span class="text-white">Hi, {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-success btn-sm">Login</a>
        {% endif %}

    </div>

</nav>
