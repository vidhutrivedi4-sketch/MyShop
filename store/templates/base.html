<!DOCTYPE html>
<html>
<head>
    <title>My Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Inter;
            margin:0;
            background:#f1f3f6;
        }

        /* NAVBAR */
        .navbar{
            background:#131921;
            padding:12px 20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            color:white;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:0 10px;
            font-weight:500;
        }

        .search{
            width:40%;
            display:flex;
        }

        .search input{
            width:100%;
            padding:8px;
            border:none;
            border-radius:4px 0 0 4px;
        }

        .search button{
            padding:8px 15px;
            border:none;
            background:#febd69;
            cursor:pointer;
            border-radius:0 4px 4px 0;
        }

        /* GRID */
        .grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            padding:10px;
            border-radius:10px;
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
            box-shadow:0 10px 20px rgba(0,0,0,0.1);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:8px;
        }

        .btn{
            display:inline-block;
            padding:8px 12px;
            background:#ff9900;
            color:black;
            text-decoration:none;
            border-radius:5px;
            margin-top:5px;
        }

        .btn:hover{
            background:#e68a00;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div><b>🛒 MyShop</b></div>

    <form class="search" action="{% url 'search' %}">
        <input name="q" placeholder="Search products">
        <button>Search</button>
    </form>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    </div>
</div>

{% block content %}
{% endblock %}

</body>
</html>
