<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f3f3f3;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .box{
            background:white;
            width:500px;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:green;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#333;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            background:#ffd814;
            color:black;
            text-decoration:none;
            padding:12px 25px;
            border-radius:5px;
            font-weight:bold;
        }

        .btn:hover{
            background:#f7ca00;
        }
    </style>
</head>
<body>

    <div class="box">

        <h1>✅ Payment Successful</h1>

        <h2>Thank You For Your Order</h2>

        <p>Your order has been placed successfully.</p>

        <p>We will deliver your products soon.</p>

        <a href="{% url 'home' %}" class="btn">
            Continue Shopping
        </a>

    </div>

</body>
</html>
